<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icons/hotel.png" />
    <title>Checkout File Formatter</title>

    <style>
      :root {
        --bg-deep: #0f172a;
        --bg-mid: #12314f;
        --bg-warm: #8b5e34;
        --glass: rgba(255, 255, 255, 0.18);
        --glass-border: rgba(255, 255, 255, 0.28);
        --text-main: #f8fafc;
        --text-soft: rgba(226, 232, 240, 0.82);
        --shadow-strong: 0 28px 80px rgba(15, 23, 42, 0.42);
        --primary: #f59e0b;
        --primary-hover: #d97706;
      }

      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        background:
          linear-gradient(rgba(8, 15, 31, 0.28), rgba(8, 15, 31, 0.58)),
          radial-gradient(
            circle at 20% 20%,
            rgba(255, 184, 77, 0.28),
            transparent 30%
          ),
          radial-gradient(
            circle at 80% 15%,
            rgba(56, 189, 248, 0.2),
            transparent 28%
          ),
          linear-gradient(
            135deg,
            var(--bg-deep),
            var(--bg-mid) 48%,
            var(--bg-warm)
          );
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02)),
          url("./images/hotel1.jpg");
        background-size: cover;
        background-position: center;
        filter: saturate(1.08) contrast(1.05);
        transform: scale(1.04);
        z-index: 0;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            circle at top,
            rgba(255, 255, 255, 0.16),
            transparent 34%
          ),
          linear-gradient(rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0));
        pointer-events: none;
        z-index: 0;
      }

      .container {
        position: relative;
        z-index: 1;
        padding: 28px 30px;
        border-radius: 28px;
        border: 1px solid var(--glass-border);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.24),
          rgba(255, 255, 255, 0.12)
        );
        box-shadow: var(--shadow-strong);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .container::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.22),
          rgba(255, 255, 255, 0.02) 55%
        );
        pointer-events: none;
      }

      .title {
        position: relative;
        font-size: 28px;
        line-height: 1.15;
        font-weight: 700;
        letter-spacing: 0.01em;
        margin-bottom: 8px;
        color: var(--text-main);
      }

      .subtitle {
        position: relative;
        font-size: 14px;
        color: var(--text-soft);
        margin-bottom: 24px;
      }

      .file-input {
        position: relative;
        display: block;
        border: 1px dashed rgba(255, 255, 255, 0.34);
        border-radius: 20px;
        padding: 22px 18px;
        text-align: center;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
        transition:
          border-color 0.2s ease,
          background 0.2s ease,
          transform 0.2s ease;
      }

      .file-input:hover {
        border-color: rgba(255, 255, 255, 0.62);
        background: rgba(255, 255, 255, 0.15);
        transform: translateY(-1px);
      }

      .file-input input {
        display: none;
      }

      .file-label {
        font-size: 15px;
        font-weight: 500;
        color: var(--text-main);
      }

      .actions {
        margin-top: 22px;
        display: flex;
        gap: 12px;
      }

      button {
        flex: 1;
        padding: 12px 14px;
        border: none;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition:
          background 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .btn-export {
        background: linear-gradient(135deg, #fbbf24, var(--primary));
        color: #111827;
        box-shadow: 0 14px 28px rgba(217, 119, 6, 0.32);
      }

      .btn-export:hover {
        background: linear-gradient(135deg, #f59e0b, var(--primary-hover));
      }

      .btn-clear {
        background: rgba(15, 23, 42, 0.34);
        color: var(--text-main);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .btn-clear:hover {
        background: rgba(15, 23, 42, 0.5);
      }

      .footer {
        position: relative;
        margin-top: 18px;
        font-size: 12px;
        color: rgba(226, 232, 240, 0.72);
        text-align: center;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .alert-modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(15, 23, 42, 0.38);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          visibility 0.25s ease;
      }

      .alert-modal.is-visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .alert-card {
        width: min(420px, 100%);
        position: relative;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 16px;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.22);
        overflow: hidden;
        transform: translateY(18px) scale(0.96);
        transition: transform 0.25s ease;
      }

      .alert-modal.is-visible .alert-card {
        transform: translateY(0) scale(1);
      }

      .alert-card__header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 20px 12px;
      }

      .alert-card__icon {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        background: #fee2e2;
        color: #b91c1c;
        font-size: 18px;
        font-weight: 700;
      }

      .alert-card[data-state="success"] .alert-card__icon {
        background: #dcfce7;
        color: #15803d;
      }

      .alert-card__title {
        font-size: 18px;
        font-weight: 700;
        color: #111827;
      }

      .alert-card__body {
        padding: 0 20px 20px;
        font-size: 14px;
        line-height: 1.6;
        color: #4b5563;
      }

      .alert-card__actions {
        display: flex;
        justify-content: flex-end;
        padding: 0 20px 20px;
      }

      .alert-card__button {
        min-width: 96px;
        background: #dc2626;
        color: #ffffff;
      }

      .alert-card__button:hover {
        background: #b91c1c;
      }

      .alert-card[data-state="success"] .alert-card__button {
        background: #16a34a;
      }

      .alert-card[data-state="success"] .alert-card__button:hover {
        background: #15803d;
      }

      @media (max-width: 560px) {
        body {
          padding: 16px;
        }

        .container {
          padding: 24px 20px;
          border-radius: 24px;
        }

        .title {
          font-size: 24px;
        }

        .actions {
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="title">Checkout File Formatter</div>
      <div class="subtitle">
        Upload file checkout and export for correct format
      </div>

      <label class="file-input" for="file">
        <input type="file" id="file" accept=".xlsx,.xls" />
        <div class="file-label" id="fileLabel">
          📄 Upload File Excel (.xlsx / .xls)
        </div>
      </label>

      <div class="actions">
        <button class="btn-clear" onclick="clearFile()">Delete</button>
        <button class="btn-export" onclick="exportExcel()">Export</button>
      </div>

      <div class="footer">© 2026 Kaysaotihon</div>
    </div>

    <div
      class="alert-modal"
      id="alertModal"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-labelledby="alertModalTitle"
      aria-describedby="alertModalMessage"
    >
      <div class="alert-card" id="alertCard" data-state="error">
        <div class="alert-card__header">
          <div class="alert-card__icon" id="alertModalIcon" aria-hidden="true">
            !
          </div>
          <div class="alert-card__title" id="alertModalTitle">Alert</div>
        </div>
        <div class="alert-card__body" id="alertModalMessage">
          Something went wrong.
        </div>
        <div class="alert-card__actions">
          <button
            id="alertModalButton"
            class="alert-card__button"
            type="button"
            onclick="hideAlertModal()"
          >
            OK
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="script.js"></script>

    <script>
      function clearFile() {
        document.getElementById("file").value = "";
        document.getElementById("fileLabel").textContent =
          "📄 Upload File Excel (.xlsx / .xls)";
      }

      const fileInput = document.getElementById("file");
      const fileLabel = document.getElementById("fileLabel");

      fileInput.addEventListener("change", () => {
        if (fileInput.files.length > 0) {
          const fileName = fileInput.files[0].name;
          fileLabel.textContent = `📄 ${fileName}`;
        } else {
          fileLabel.textContent = "📄 Upload File Excel (.xlsx / .xls)";
        }
      });
    </script>
  </body>
</html>
